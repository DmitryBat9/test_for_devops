#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept
        iifname "enp0s8" oifname "enp0s3" ip saddr 192.168.50.0/24 accept
        iifname "enp0s3" oifname "enp0s8" ip saddr 192.168.1.0/24 ip daddr 192.168.50.0/24 tcp dport { 30080, 30443 } accept
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        oifname "enp0s3" ip saddr 192.168.50.0/24 masquerade
    }
}
