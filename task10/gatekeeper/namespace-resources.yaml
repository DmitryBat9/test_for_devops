apiVersion: v1
kind: ResourceQuota
metadata:
  name: task9-quota
  namespace: task9
spec:
  hard:
    pods: "10"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: task9-limits
  namespace: task9
spec:
  limits:
    - type: Container
      min:
        cpu: 10m
        memory: 32Mi
      max:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 25m
        memory: 64Mi
      default:
        cpu: 250m
        memory: 256Mi
    - type: Pod
      max:
        cpu: "1"
        memory: 1Gi
